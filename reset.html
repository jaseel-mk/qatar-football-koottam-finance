<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f0e8">
  <title>Reset Password — Qatar Football Koottam</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#062d20;
      color:#0b2119;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .card{
      width:100%;
      max-width:520px;
      background:#fff;
      border-radius:28px;
      padding:34px 28px;
      box-shadow:0 20px 60px rgba(0,0,0,.2);
    }
    h1{margin:0 0 10px;font-size:32px}
    p{color:#71837b;line-height:1.5}
    label{display:block;margin:20px 0 8px;font-weight:600}
    input{
      width:100%;
      padding:15px 16px;
      border:1px solid #dce6e1;
      border-radius:14px;
      font-size:16px;
      outline:none;
    }
    input:focus{border-color:#0a3527}
    button{
      width:100%;
      margin-top:22px;
      padding:16px;
      border:0;
      border-radius:14px;
      background:#073525;
      color:white;
      font-size:17px;
      font-weight:700;
      cursor:pointer;
    }
    #message{margin-top:16px;font-weight:600}
    .back{display:block;text-align:center;margin-top:18px;color:#52786d}
  </style>
</head>
<body>
  <main class="card">
    <h1>Create a new password</h1>
    <p>Enter your new password below. After updating it, you can sign in to Football Finance.</p>

    <form id="resetForm">
      <label for="password">New password</label>
      <input id="password" type="password" minlength="6" placeholder="At least 6 characters" required>

      <label for="confirm">Confirm password</label>
      <input id="confirm" type="password" minlength="6" placeholder="Enter password again" required>

      <button type="submit">Update password</button>
    </form>

    <div id="message"></div>
    <a class="back" href="redirectTo: "https://jaseel-mk.github.io/qatar-football-koottam-finance/reset.html"">Back to sign in</a>
  </main>

  <script>
    const SUPABASE_URL = "https://soakyzawpmsoxqodskgr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_knMPrkJfZ003rPvb7bRgRA_QJC8DWGJ";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });

    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");

    sb.auth.onAuthStateChange((event) => {
      if(event === "PASSWORD_RECOVERY"){
        message.textContent = "Recovery link verified. Enter your new password.";
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if(password.length < 6){
        message.textContent = "Password must be at least 6 characters.";
        return;
      }

      if(password !== confirm){
        message.textContent = "Passwords do not match.";
        return;
      }

      message.textContent = "Updating password...";

      const { error } = await sb.auth.updateUser({ password });

      if(error){
        console.error(error);
        message.textContent = error.message;
        return;
      }

      message.textContent = "Password updated successfully. You can now sign in.";

      setTimeout(() => {
        window.location.href = "redirectTo: "https://jaseel-mk.github.io/qatar-football-koottam-finance"";
      }, 1500);
    });
  </script>
</body>
</html>
